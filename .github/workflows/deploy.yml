name: Deploy to Self-Hosted Runner

on:
  push:
    branches:
      - main
      - master
      - v1.1
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, DWGSVR]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.22.0

      - name: Install dependencies
        run: pnpm install

      - name: Build backend
        run: pnpm build:backend

      - name: Build frontend
        run: pnpm build:frontend

      - name: Restart PM2 services
        run: |
          pm2 restart ecosystem.config.js --update-env
        shell: powershell
